services:

  mysql:
    image: mysql:8.0
    container_name: tefa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tefa
      MYSQL_USER: tefa_user
      MYSQL_PASSWORD: tefa_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/tefa_database.sql:/docker-entrypoint-initdb.d/tefa_database.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tefa-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"

volumes:
  mysql_data: